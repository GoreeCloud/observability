name: Validate GoreeCloud Observability foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GOREECLOUD_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.GOREECLOUD_SOURCE_REVISION }}
          persist-credentials: false
      - name: Verify exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GOREECLOUD_SOURCE_REVISION"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install --no-deps -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile source
        run: python -m compileall -q src
